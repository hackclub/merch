<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#ec3750" />
		<!-- share: the server swaps this block for a product's own tags on /items/<id> (internal/httpapi/share.go) -->
		<!-- share -->
		<meta name="description" content="Free Hack Club swag, mailed to you: stickers, posters, magazines and shirts for your club, hackathon or booth." />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Hack Club Merch" />
		<meta property="og:title" content="Hack Club Merch" />
		<meta property="og:description" content="Free Hack Club swag, mailed to you: stickers, posters, magazines and shirts for your club, hackathon or booth." />
		<meta property="og:url" content="https://merch.hackclub.com/" />
		<meta property="og:image" content="https://merch.hackclub.com/og.gif" />
		<meta property="og:image:type" content="image/gif" />
		<meta property="og:image:width" content="900" />
		<meta property="og:image:height" content="473" />
		<meta property="og:image:alt" content="Flipping through the Hack Club Mini-Magazine on a workbench, next to the words: Free swag, mailed to you." />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Hack Club Merch" />
		<meta name="twitter:description" content="Free Hack Club swag, mailed to you: stickers, posters, magazines and shirts for your club, hackathon or booth." />
		<meta name="twitter:image" content="https://merch.hackclub.com/og.jpg" />
		<meta name="twitter:image:alt" content="The Hack Club Mini-Magazine on a workbench, next to the words: Free swag, mailed to you." />
		<!-- /share -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/icon-192.png" />
		<title>Hack Club Merch Request</title>
		<!-- The server is in Finland, so every round trip counts: open the font and image hosts now, and
		     start loading the catalog with the HTML instead of after the app's code ($lib/api takes it over). -->
		<link rel="preconnect" href="https://assets.hackclub.com" crossorigin />
		<link rel="preconnect" href="https://cdn.hackclub.com" />
		<script>
			if (location.pathname === '/' || location.pathname.startsWith('/items/'))
				window.__catalog = fetch('/api/catalog', { credentials: 'same-origin', headers: { Accept: 'application/json' } });
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
